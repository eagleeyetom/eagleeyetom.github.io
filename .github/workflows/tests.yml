name: Browser tests

# Accessibility (axe), console errors, scripts, and opening the site from disk.
# Runs next to the deploy: a failure shows up as a red check, it does not stop publishing.
on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:static

      - run: npm run test:browser

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
